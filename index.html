<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rock Paper Scissors Game</title>
</head>
<body>
    <h1>Rock Paper Scissor Game</h1>
    <p>Press play to start and then select an option:</p>
    <div class="play-button"><button id="play">Play</button></div>
    <p id="gamestate"></p>
    <div class="choices">
        <button id="rock" type="button"><img src="images/rock.png" alt="Rock"></button>
        <button id="paper" type="button"><img src="images/paper.png" alt="Paper"></button>
        <button id="scissor" type="button"><img src="images/scissor.png" alt="Scissor"></button>
    </div>
        <p id="result"></p>
</body>
<script src="game.js"></script>
</html>
